<!DOCTYPE html>
<html lang="{{ 'ar' if g.current_language == 'ar' else 'en' }}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="canonical" href="{{ request.base_url }}">

<link rel="stylesheet" href="{{ url_for('static', filename='calendars.css') }}">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

<link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='responsive_styles.css') }}">


<link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon-96x96_v3.png') }}" sizes="96x96" />
<link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon_v3.svg') }}" />
<link rel="shortcut icon" href="{{ url_for('static', filename='favicon_v3.ico') }}" />
<link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='apple-touch-icon_v3.png') }}" />
<meta name="apple-mobile-web-app-title" content="HAWARY" />
<link rel="manifest" href="{{ url_for('static', filename='site_v3.webmanifest') }}" />


<title>{{ g.translations['top_name'] }}</title>
</head>
<body class="{{ 'rtl' if g.current_language == 'ar' else '' }}">
    <div class="content">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
