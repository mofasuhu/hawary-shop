{% extends 'base.html' %}
{% block title %}{{ g.translations['Sign_Up_New_Admin'] }}{% endblock %}
{% block content %}
<a href="{{ url_for('admin_accounts_manager') }}" class="back-button">{{ g.translations['Back_to_Accounts'] }}</a>
<h1>{{ g.translations['Sign_Up_New_Admin'] }}</h1>
<div class="form-container">
<form action="{{ url_for('superadmin_admin_signup') }}" method="post" onsubmit="return validateAndConfirmPassword();">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<div class="form-group-login-signup">
<input type="text" id="username" name="username" placeholder="{{ g.translations['Email_Address'] }}" required><br>
<span id="usernameMessage"></span><br>
<input type="password" id="password" name="password" placeholder="{{ g.translations['Enter_Password'] }}" required><br>
<input type="password" id="confirm_password" name="confirm_password" placeholder="{{ g.translations['Confirm_Password'] }}" required><br>
<span id="passwordMessage"></span><br>
<input type="text" name="full_name" placeholder="{{ g.translations['Full_Name'] }}" required><br>
<input type="text" name="mobile" placeholder="{{ g.translations['Mobile'] }}" required><br>

<select name="area" id="area-select" required>
  <option disabled selected value="">{{ g.translations['Select_Area'] }}</option>
  {% for gov in governorates %}
    <option value="{{ gov }}">
      {{ g.translations[gov] }}
    </option>
  {% endfor %}
</select>

<input type="text" name="address" placeholder="{{ g.translations['Address'] }}" required><br>
<input type="submit" value="{{ g.translations['Sign_Up'] }}">
</div>
</form>
</div>
{% endblock %}
