{% extends 'base_error.html' %}
{% block title %}{{ g.translations['Too_many_requests_title'] }}{% endblock %}

{% block content %}
<div class="rate-limit-container">
    <h1>{{ g.translations['Too_many_requests_title'] }}</h1>
    <p>{{ g.translations['Too_many_requests_body'] }}</p>
    <a href="{{ url_for('home') }}" class="back-button">{{ g.translations['Back_to_Home'] }}</a>
</div>

<style>
    .rate-limit-container {
        text-align: center;
        padding: 50px 20px;
        max-width: 600px;
        margin: 40px auto;
        border: 1px solid #ddd;
        border-radius: 8px;
        background-color: #f9f9f9;
    }
    .rate-limit-container h1 {
        font-size: 2em;
        color: #d9534f;
    }
    .rate-limit-container p {
        font-size: 1.2em;
        margin: 20px 0;
    }
</style>
{% endblock %}
